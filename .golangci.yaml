# enable-all / disable-few; the disable list is copied from headscale (the
# house reference config), not curated per-repo.
version: "2"

linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - exhaustruct
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - godox
    - gomodguard
    - interfacebloat
    - ireturn
    - lll
    - maintidx
    - makezero
    - mnd
    - musttag
    - nestif
    - nolintlint
    - paralleltest
    - revive
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    # Newer golangci linters beyond headscale's list, disabled in the same
    # "pedantic style, not correctness" spirit as wsl/revive above.
    - wsl_v5 # wsl renamed in golangci v2
    - exhaustruct_v5 # exhaustruct renamed in golangci v2.13
    - nlreturn # blank-line-before-return pedantry
    - noinlineerr # forbids the standard `if err := f(); err != nil` idiom
    - nonamedreturns # named returns are used deliberately
    - err113 # dynamic fmt.Errorf is fine in a small app
    - modernize # style suggestions, not bugs
    - errchkjson # false-positives on `any` HTTP response bodies
  settings:
    goconst:
      # Test fixtures repeat strings by their nature; extracting them obscures
      # the test rather than helping. Production code stays strict.
      ignore-tests: true
      min-occurrences: 5
      min-len: 6
    forbidigo:
      forbid:
        - pattern: 'time\.Sleep'
          msg: >-
            time.Sleep is forbidden.
            In tests: use assert.EventuallyWithT for polling/waiting patterns.
            In production code: use a backoff strategy (e.g., cenkalti/backoff)
            or proper synchronization primitives.
      analyze-types: true
    gocritic:
      disabled-checks:
        - appendAssign
        - ifElseChain
    nlreturn:
      block-size: 4
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may skip some rigor; err113 because tests inject one-off fake
      # errors by nature.
      - path: _test\.go
        linters:
          - err113
          - errcheck
          - forcetypeassert
          - gosec
          - intrange
          - modernize
          - noctx
    paths:
      - gen

# Mirrors the treefmt formatting check (the source of truth) so `golangci-lint
# fmt` produces the same result: gofumpt + goimports grouping local packages last.
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kradalby/garnixlogs
  exclusions:
    paths:
      - gen/
      - testdata/
